name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDK root: $SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          ls "$SDK_ROOT/platforms" || true
          ls "$SDK_ROOT/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Compile debug APK
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace > build-debug.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 10 build-debug.log
            echo "===== KOTLIN COMPILER ERRORS ====="
            grep -E "^e: " build-debug.log | head -300
            echo "===== END KOTLIN COMPILER ERRORS ====="
          fi
          exit $status

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-log
          path: build-debug.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Compile installable QA release APK
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ -f "$APK" ]; then
            echo "::error::Release APK is still unsigned; refusing to publish an uninstallable package."
            exit 1
          fi
          find app/build/outputs/apk/release -name "*.apk" -print -exec apksigner verify --verbose {} \;

      - name: Collect APK outputs
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: build-launch-fly-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload all APKs
        uses: actions/upload-artifact@v4
        with:
          name: build-launch-fly-qa-signed-apks
          path: artifacts/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload release AAB if produced
        uses: actions/upload-artifact@v4
        with:
          name: build-launch-fly-bundle
          path: app/build/outputs/bundle/**/*.aab
          if-no-files-found: ignore
          retention-days: 30
