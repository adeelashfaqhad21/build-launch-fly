name: Android Build

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" SDK package no longer exists in Google's package repository.
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install required Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -print -quit 2>/dev/null)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          test -d "$SDK_ROOT/platforms/android-34"
          test -d "$SDK_ROOT/build-tools/34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Compile debug APK
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace > build-debug.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 10 build-debug.log
            echo "===== KOTLIN COMPILER ERRORS ====="
            grep -E "^e: " build-debug.log | head -300
            echo "===== END KOTLIN COMPILER ERRORS ====="
          fi
          exit $status

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-log
          path: build-debug.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Compile and validate installable QA release APK
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace
          RELEASE_DIR="app/build/outputs/apk/release"
          APK="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::No signed release APK was produced."
            find "$RELEASE_DIR" -maxdepth 1 -type f -print || true
            exit 1
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          PACKAGE="$("$BUILD_TOOLS/aapt" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          if [ "$PACKAGE" != "com.buildlaunchfly.game" ]; then
            echo "::error::Unexpected APK package id: $PACKAGE"
            exit 1
          fi
          mkdir -p artifacts
          cp "$APK" artifacts/Build-Launch-Fly-TEST-SIGNED.apk
          echo "Validated package: $PACKAGE"
          ls -lh artifacts/Build-Launch-Fly-TEST-SIGNED.apk

      - name: Collect debug APK
        run: |
          mkdir -p artifacts-debug
          cp app/build/outputs/apk/debug/app-debug.apk artifacts-debug/Build-Launch-Fly-DEBUG.apk
          ls -lh artifacts-debug

      - name: Upload debug APK (diagnostics only)
        uses: actions/upload-artifact@v4
        with:
          name: build-launch-fly-debug
          path: artifacts-debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload installable QA-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: build-launch-fly-android-test-signed
          path: artifacts/Build-Launch-Fly-TEST-SIGNED.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release AAB if produced
        uses: actions/upload-artifact@v4
        with:
          name: build-launch-fly-bundle
          path: app/build/outputs/bundle/**/*.aab
          if-no-files-found: ignore
          retention-days: 30
