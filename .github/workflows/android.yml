name: Android Build

on:
  push:
    branches: [ main, master, working, development, 'fix/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDK root: $SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          ls "$SDK_ROOT/platforms" || true
          ls "$SDK_ROOT/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Compile debug APK
        run: |
          set +e
          gradle :app:assembleDebug --no-daemon --stacktrace > build-debug.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 10 build-debug.log
            echo "===== KOTLIN COMPILER ERRORS ====="
            grep -E "^e: " build-debug.log | head -300
            echo "===== END KOTLIN COMPILER ERRORS ====="
          fi
          exit $status

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-log
          path: build-debug.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Restore cached signing key
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blf-release.jks
          key: blf-release-keystore-v1

      - name: Prepare release signing
        env:
          SECRET_KEYSTORE: ${{ secrets.BLF_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.BLF_STORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.BLF_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.BLF_KEY_PASSWORD }}
        run: |
          set -e
          KEYSTORE="$RUNNER_TEMP/blf-release.jks"
          if [ -f "$KEYSTORE" ]; then
            echo "Using the cached release keystore"
            STORE_PASS="buildlaunchfly-release"
            KEY_ALIAS="blf-release"
            KEY_PASS="$STORE_PASS"
          elif [ -n "$SECRET_KEYSTORE" ]; then
            echo "Using the keystore from repository secrets"
            printf '%s' "$SECRET_KEYSTORE" | base64 --decode > "$KEYSTORE"
            STORE_PASS="$SECRET_STORE_PASSWORD"
            KEY_ALIAS="$SECRET_KEY_ALIAS"
            KEY_PASS="$SECRET_KEY_PASSWORD"
          else
            echo "Generating a release keystore (add BLF_* secrets to keep one permanently)"
            STORE_PASS="buildlaunchfly-release"
            KEY_ALIAS="blf-release"
            KEY_PASS="$STORE_PASS"
            keytool -genkeypair -keystore "$KEYSTORE" \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Build Launch Fly, OU=Game, O=BuildLaunchFly, L=Unknown, ST=Unknown, C=US"
          fi
          {
            echo "BLF_STORE_FILE=$KEYSTORE"
            echo "BLF_STORE_PASSWORD=$STORE_PASS"
            echo "BLF_KEY_ALIAS=$KEY_ALIAS"
            echo "BLF_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"
          ls -l "$KEYSTORE"

      - name: Compile signed release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK outputs
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;
          ls -la artifacts

          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -n 1)"
          if [ -n "$APKSIGNER" ]; then
            RELEASE_APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
            if [ -n "$RELEASE_APK" ]; then
              echo "===== RELEASE APK SIGNATURE ====="
              "$APKSIGNER" verify --print-certs "$RELEASE_APK" | head -n 30 || true
              echo "===== END RELEASE APK SIGNATURE ====="
            fi
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: build-launch-fly-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: build-launch-fly-release-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload all APKs
        uses: actions/upload-artifact@v4
        with:
          name: build-launch-fly-apks
          path: artifacts/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload release AAB if produced
        uses: actions/upload-artifact@v4
        with:
          name: build-launch-fly-bundle
          path: app/build/outputs/bundle/**/*.aab
          if-no-files-found: ignore
          retention-days: 30
